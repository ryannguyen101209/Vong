# One-click deploy config for Render. Any host that runs a normal Node process
# with a writable disk works the same way; this file just saves you filling the
# same values into a web form.
services:
  - type: web
    # The name sets the address, https://vong-hcmc-marketplace.onrender.com.
    # client/vercel.json forwards /api and /uploads there; keep the two in step.
    name: vong-hcmc-marketplace
    runtime: node
    plan: starter          # a plan with a persistent disk; free plans have none
    # --include=dev: NODE_ENV=production would otherwise skip Vite, and the build fails.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Two hops: Vercel's proxy, then Render's load balancer. With one, every
      # visitor shares Vercel's IP and hits the same rate limit.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false        # set this yourself in the dashboard; never commit it
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false        # the Vercel site's exact HTTPS origin; comma-separated if several
      # Keep the database and uploaded photos on the mounted disk, so they
      # survive a redeploy. Without this, every deploy wipes your listings.
      - key: DATABASE_FILE
        value: /var/vong-data/vong.db
      - key: UPLOADS_DIR
        value: /var/vong-data/uploads
    disk:
      name: vong-data
      mountPath: /var/vong-data
      sizeGB: 1
