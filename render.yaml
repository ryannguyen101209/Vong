# One-click deploy config for Render. Any host that runs a normal Node process
# with a writable disk works the same way; this file just saves you filling the
# same values into a web form.
services:
  - type: web
    name: vong
    runtime: node
    plan: starter          # a plan with a persistent disk; free plans have none
    buildCommand: npm install --include=dev && npm run build   # Render sets NODE_ENV=production, which would skip Vite
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false        # set this yourself in the dashboard; never commit it
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false        # exact public HTTPS origin; comma-separated if needed
      - key: RESEND_API_KEY
        sync: false        # optional: turns on automatic emails
      - key: MAIL_FROM
        sync: false        # e.g. Vòng <hello@usevong.com>, on a domain verified in Resend
      - key: SEPAY_API_KEY
        sync: false        # optional: turns on automatic payment confirmation
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: PAYMENT_AUTO_PUBLISH
        value: "false"      # true = paid listings go live without your approval
      - key: ANTHROPIC_API_KEY
        sync: false        # optional: turns on the "Translate" button on listings
      # Keep the database and uploaded photos on the mounted disk, so they
      # survive a redeploy. Without this, every deploy wipes your listings.
      - key: DATABASE_FILE
        value: /var/vong-data/vong.db
      - key: UPLOADS_DIR
        value: /var/vong-data/uploads
    disk:
      name: vong-data
      mountPath: /var/vong-data
      sizeGB: 1
